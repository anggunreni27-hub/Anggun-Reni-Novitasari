<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkCoquetteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb6c1" />
      <stop offset="50%" stop-color="#ff69b4" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="softSilk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e9" />
      <stop offset="100%" stop-color="#f8a5c2" />
    </linearGradient>
    <filter id="coquetteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f472a1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="60" cy="60" r="54" fill="#fff0f5" stroke="#fbcfe8" stroke-width="2" />
  
  <!-- Ribbon Bow SVG Graphics -->
  <g filter="url(#coquetteGlow)" transform="translate(10, 15) scale(0.82)">
    <!-- Left Ribbon Loop -->
    <path d="M60 50 C40 20, 10 30, 20 52 C28 68, 52 58, 60 52 Z" fill="url(#pinkCoquetteGrad)" />
    <path d="M55 48 C42 28, 22 36, 28 50 C34 60, 48 54, 55 48 Z" fill="url(#softSilk)" opacity="0.6" />

    <!-- Right Ribbon Loop -->
    <path d="M60 50 C80 20, 110 30, 100 52 C92 68, 68 58, 60 52 Z" fill="url(#pinkCoquetteGrad)" />
    <path d="M65 48 C78 28, 98 36, 92 50 C86 60, 72 54, 65 48 Z" fill="url(#softSilk)" opacity="0.6" />

    <!-- Left Ribbon Tail -->
    <path d="M55 54 C48 70, 32 90, 22 105 C32 98, 44 96, 50 102 C54 86, 56 68, 58 56 Z" fill="url(#pinkCoquetteGrad)" />

    <!-- Right Ribbon Tail -->
    <path d="M65 54 C72 70, 88 90, 98 105 C88 98, 76 96, 70 102 C66 86, 64 68, 62 56 Z" fill="url(#pinkCoquetteGrad)" />

    <!-- Center Knot -->
    <ellipse cx="60" cy="52" rx="9" ry="8" fill="#f43f5e" />
    <ellipse cx="60" cy="51" rx="6" ry="5" fill="#fda4af" />

    <!-- Pearl Center Accent -->
    <circle cx="60" cy="51" r="3" fill="#ffffff" />
  </g>
  
  <!-- Tiny Sparkles -->
  <path d="M22 28 L24 22 L26 28 L32 30 L26 32 L24 38 L22 32 L16 30 Z" fill="#f472a1" opacity="0.75" />
  <path d="M96 24 L97.5 19 L99 24 L104 25.5 L99 27 L97.5 32 L96 27 L91 25.5 Z" fill="#fb7185" opacity="0.75" />
</svg>
